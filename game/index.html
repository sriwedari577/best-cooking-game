<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Dapur Kilat — Lightning Kitchen</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1c130e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, 266.67vh); height: min(100vh, 37.5vw); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
          touch-action: none; cursor: pointer; background: #2a1c12; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 0; top: 0; color: #fff; font: 12px monospace;
              background: rgba(0,0,0,.6); padding: 2px 6px; display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="480"
    aria-label="Dapur Kilat: masak pesanan pelanggan di dapur cepat saji. Gerakkan koki dengan keyboard atau klik, rakit hidangan, dan sajikan sebelum timer habis."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="selftest"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
